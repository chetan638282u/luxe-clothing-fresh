<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <title>LUXE — Luxury Clothing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        background: #0a0a0a;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column;
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }
      #splash.hidden {
        opacity: 0; visibility: hidden;
        pointer-events: none;
      }
      .splash-title {
        font-family: 'Playfair Display', serif;
        font-size: 3rem; color: #c9a961;
        letter-spacing: 0.3em; text-transform: uppercase;
        margin-bottom: 0.5rem;
      }
      .splash-tagline {
        font-family: 'Inter', sans-serif;
        font-size: 0.75rem; color: rgba(255,255,255,0.4);
        letter-spacing: 0.2em; text-transform: uppercase;
      }
      .splash-loader {
        margin-top: 2rem;
        width: 40px; height: 2px;
        background: rgba(201,169,97,0.2);
        position: relative; overflow: hidden;
      }
      .splash-loader::after {
        content: '';
        position: absolute; inset: 0;
        background: #c9a961;
        animation: splash-loading 1.2s ease-in-out infinite;
      }
      @keyframes splash-loading {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(200%); }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="splash-title">LUXE</div>
      <div class="splash-tagline">Luxury Clothing</div>
      <div class="splash-loader"></div>
    </div>
    <script>setTimeout(function(){var s=document.getElementById('splash');if(s){s.classList.add('hidden');setTimeout(function(){s.remove()},700)}},5000)</script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
